# Bandhan — Render Blueprint (free tier)
# Deploy: Render dashboard > New > Blueprint > connect this repo > Apply.
# Secrets to fill in the dashboard afterwards (sync: false):
#   REDIS_URL (Upstash free Redis), SMTP_PASS (Gmail 16-digit app password),
#   API_BASE_URL + FRONTEND_URL (set to the service URL after first deploy).
# The backend also serves the website itself from backend/public/
# (index.html = exported Bandhan site; /confirmed.html already there),
# so site + API share one origin and relative /api paths work.

databases:
  - name: bandhan-db
    plan: free
    databaseName: bandhan
    user: bandhan_app

services:
  - type: web
    name: bandhan-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma db push && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bandhan-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: you@example.com
      - key: SMTP_FROM
        value: Bandhan <you@example.com>
      - key: SMTP_PASS
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
